<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dojo Hub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Bouton pour ouvrir le menu -->
    <button id="menu-btn" class="menu-btn" aria-label="Ouvrir le menu">☰</button>

    <!-- Menu Coulissant (Slide Menu) -->
    <nav id="slide-menu" class="slide-menu">
        <button id="close-btn" class="close-btn" aria-label="Fermer le menu">&times;</button>
        <div class="menu-header">
            <h2>Dojo Hub</h2>
        </div>
        <ul class="menu-links">
            <li><a href="#accueil">Accueil</a></li>
            <li><a href="#cours">Nos Cours</a></li>
            <li><a href="#planning">Planning</a></li>
            <li><a href="#contact">Contact</a></li>
        </ul>
    </nav>

    <!-- Overlay sombre quand le menu est ouvert -->
    <div id="menu-overlay" class="menu-overlay"></div>

    <!-- Contenu Principal -->
    <main class="main-content">
        <header class="hero">
            <h1>Bienvenue sur votre Dojo Hub</h1>
            <p>Votre espace d'entraînement et de gestion accessible partout.</p>
        </header>

        <section id="accueil" class="section">
            <h2>Tableau de bord</h2>
            <p>Sélectionnez une option dans le menu coulissant pour naviguer à travers les sections du dojo.</p>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
