<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RVXNN // Hub</title>
    <style>
        :root {
            --bg-color: #000000;
            --panel-bg: #080b11;
            --cyan-neon: #00f5d4;
            --violet-neon: #9146ff;
            --danger-red: #ff1e1e;
            --text-main: #ffffff;
            --text-muted: #8b949e;
            --border-color: #21262d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* --- LANDING PAGE --- */
        #landing-page {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at center, #0a0e17 0%, #000000 100%);
            z-index: 1000;
            cursor: pointer;
            transition: opacity 0.4s ease, visibility 0.4s ease;
        }

        #landing-page.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .landing-container {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 25px;
        }

        .logo-wrapper {
            width: 180px;
            height: 180px;
            filter: drop-shadow(0 0 25px rgba(255, 30, 30, 0.5));
            transition: transform 0.3s ease;
        }

        .landing-container:hover .logo-wrapper {
            transform: scale(1.05);
        }

        .enter-btn {
            background: linear-gradient(135deg, var(--danger-red), #8b0000);
            color: white;
            border: none;
            padding: 14px 35px;
            font-size: 16px;
            font-weight: 900;
            letter-spacing: 3px;
            text-transform: uppercase;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(255, 30, 30, 0.5);
            transition: all 0.2s ease;
        }

        .enter-btn:hover {
            box-shadow: 0 0 30px rgba(255, 30, 30, 0.9);
            transform: translateY(-2px);
        }

        .hint-text {
            color: var(--text-muted);
            font-size: 13px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* --- SITE PRINCIPAL --- */
        #main-app {
            display: none;
            flex-direction: column;
            width: 100%;
            min-height: 100vh;
        }

        #main-app.active {
            display: flex;
        }

        /* --- MENU EN HAUT --- */
        header {
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            padding: 12px 20px;
            background-color: var(--panel-bg);
            border-bottom: 2px solid var(--border-color);
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            gap: 15px;
            overflow: hidden;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }

        .header-logo {
            width: 32px;
            height: 32px;
        }

        .header-title {
            font-size: 18px;
            font-weight: 900;
            letter-spacing: 1px;
            background: linear-gradient(90deg, #ffffff, var(--danger-red));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        nav {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            white-space: nowrap;
            padding-bottom: 4px;
            scrollbar-width: none;
        }

        nav::-webkit-scrollbar {
            display: none;
        }

        .nav-link {
            background: transparent;
            color: var(--text-muted);
            border: 1px solid transparent;
            padding: 6px 14px;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
            flex-shrink: 0;
        }

        .nav-link:hover {
            color: var(--text-main);
            background-color: rgba(255, 30, 30, 0.1);
        }

        .nav-link.active {
            color: var(--text-main);
            border-color: var(--danger-red);
            background-color: rgba(255, 30, 30, 0.2);
            box-shadow: 0 0 10px rgba(255, 30, 30, 0.3);
        }

        /* --- ZONE DE GLISSEMENT --- */
        #content-viewport {
            flex: 1;
            width: 100%;
            overflow: hidden;
            position: relative;
        }

        .slider-track {
            display: flex;
            width: 400%;
            height: 100%;
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .page-content {
            width: 25%;
            padding: 30px 20px;
            display: flex;
            justify-content: center;
        }

        .page-inner {
            width: 100%;
            max-width: 900px;
        }

        h2.page-title {
            font-size: 22px;
            color: var(--danger-red);
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 8px;
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
        }

        .card {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
        }

        /* Styles du lecteur & Statut Stream */
        .stream-container {
            position: relative;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            background: #111;
            min-height: 320px;
        }

        #twitch-embed {
            width: 100% !important;
            height: 350px !important;
        }

        .twitch-btn {
            display: block;
            margin-top: 15px;
            background: linear-gradient(135deg, var(--violet-neon), #6441a5);
            color: white;
            text-align: center;
            padding: 12px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 0 15px rgba(145, 70, 255, 0.4);
            transition: transform 0.2s ease;
        }

        .twitch-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 25px rgba(145, 70, 255, 0.8);
        }

        .profile-header {
            display: flex;
            align-items: center;
            gap: 20px;
            background: var(--panel-bg);
            padding: 20px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            margin-bottom: 20px;
        }

        .big-avatar {
            width: 70px; height: 70px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--violet-neon), var(--cyan-neon));
            display: flex; justify-content: center; align-items: center;
            font-size: 28px; font-weight: 900;
        }

        .rank-tag {
            display: inline-block;
            background: var(--cyan-neon); color: #000;
            padding: 3px 10px; border-radius: 4px;
            font-weight: bold; font-size: 11px; margin-top: 6px;
        }

        .feed-item {
            display: flex; justify-content: space-between; align-items: center;
            background: var(--panel-bg); border-radius: 6px; padding: 12px 18px;
            margin-bottom: 10px; border: 1px solid var(--border-color);
        }
        .feed-item.kill { border-left: 4px solid var(--cyan-neon); }
        .feed-item.death { border-left: 4px solid var(--danger-red); }

        .feed-player { display: flex; align-items: center; gap: 12px; }
        .feed-avatar {
            width: 35px; height: 35px; border-radius: 50%; background: #161b22;
            display: flex; justify-content: center; align-items: center; font-weight: bold; font-size: 13px;
        }
        .player-name { font-weight: bold; font-size: 15px; }
        .weapon-tag { font-size: 11px; color: var(--text-muted); }
        .match-info { text-align: right; font-size: 12px; color: var(--text-muted); }
    </style>
</head>
<body>

    <!-- PAGE D'ACCUEIL -->
    <div id="landing-page" onclick="enterSite()">
        <div class="landing-container">
            <div class="logo-wrapper">
                <svg viewBox="0 0 400 400" width="100%" height="100%">
                    <defs>
                        <linearGradient id="badge-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#ff1e1e" />
                            <stop offset="100%" stop-color="#550000" />
                        </linearGradient>
                    </defs>
                    <rect width="100%" height="100%" rx="24" fill="#040507" />
                    <polygon points="200,30 350,90 320,310 200,370 80,310 50,90" fill="#0b0f17" stroke="url(#badge-gradient)" stroke-width="5" />
                    <text x="200" y="235" font-family="'Arial Black', sans-serif" font-weight="900" font-size="140" fill="#ffffff" text-anchor="middle">锐</text>
                </svg>
            </div>
            <button class="enter-btn">ENTRER</button>
            <p class="hint-text">Clique n'importe où pour accéder au hub</p>
        </div>
    </div>

    <!-- SITE PRINCIPAL -->
    <div id="main-app">
        <!-- MENU EN HAUT -->
        <header>
            <div class="header-left">
                <div class="header-logo">
                    <svg viewBox="0 0 400 400" width="100%" height="100%">
                        <polygon points="200,30 350,90 320,310 200,370 80,310 50,90" fill="#0b0f17" stroke="#ff1e1e" stroke-width="6" />
                        <text x="200" y="235" font-family="'Arial Black', sans-serif" font-weight="900" font-size="140" fill="#ffffff" text-anchor="middle">锐</text>
                    </svg>
                </div>
                <span class="header-title">RVXNN</span>
            </div>
            <nav id="navMenu">
                <button class="nav-link active" onclick="switchSlide(0, this)">Stream</button>
                <button class="nav-link" onclick="switchSlide(1, this)">Profil</button>
                <button class="nav-link" onclick="switchSlide(2, this)">Kills</button>
                <button class="nav-link" onclick="switchSlide(3, this)">Morts</button>
            </nav>
        </header>

        <!-- ZONE DE GLISSEMENT -->
        <div id="content-viewport">
            <div class="slider-track" id="sliderTrack">
                
                <!-- 1. STREAM -->
                <div class="page-content">
                    <div class="page-inner">
                        <h2 class="page-title">Live Stream</h2>
                        
                        <div class="stream-container">
                            <!-- Conteneur officiel pour le lecteur Twitch -->
                            <div id="twitch-embed"></div>
                        </div>

                        <a href="https://www.twitch.tv/rvxnnnn" target="_blank" class="twitch-btn">📺 Visiter la chaîne Twitch</a>
                    </div>
                </div>
                                <!-- 2. PROFIL -->
                <div class="page-content">
                    <div class="page-inner">
                        <h2 class="page-title">Profil Joueur</h2>
                        
                        <div class="profile-header" style="background: linear-gradient(135deg, #0d1117, #161b22); border: 1px solid var(--border-color); border-radius: 12px; padding: 20px; display: flex; align-items: center; gap: 20px; position: relative; overflow: hidden;">
                            
                            <!-- Avatar avec liseré et drapeau -->
                            <div style="position: relative; flex-shrink: 0;">
                                <div style="width: 75px; height: 75px; border-radius: 50%; border: 3px solid #ff477e; overflow: hidden; box-shadow: 0 0 15px rgba(255, 71, 126, 0.4);">
                                <img src="https://images.unsplash.com/photo-1544005313-94ddf0286df2?w=500" alt="Avatar" style="width:100%;height:100%;object-fit:cover;">
                                    
                                </div>
                                <span style="position: absolute; bottom: 0; right: 0; font-size: 16px; background: #000; border-radius: 50%; padding: 1px;" title="France">🇫🇷</span>
                            </div>

                            <!-- Infos du joueur -->
                            <div style="display: flex; flex-direction: column; gap: 4px;">
                                <div style="display: flex; align-items: center; gap: 6px;">
                                    <svg viewBox="0 0 24 24" width="16" height="16" fill="#2bd95e"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
                                    <h1 style="font-size: 18px; font-weight: 800; color: #ffffff; margin: 0;">Twitch Rvxnn</h1>
                                </div>
                                <span class="rank-tag">Unreal Division</span>
                            </div>

                        </div>

                        <div class="cards-grid" style="margin-top: 15px;">
                            <div class="card"><h3>K/D Ratio</h3><p style="font-size:24px; color:var(--cyan-neon); font-weight:bold;" id="stat-kd">1.78</p></div>
                            <div class="card"><h3>Victoires</h3><p style="font-size:24px; font-weight:bold;" id="stat-wins">544</p></div>
                        </div>
                    </div>
                </div>
                

                <!-- 3. KILLS -->
                <div class="page-content">
                    <div class="page-inner">
                        <h2 class="page-title">Historique des Kills</h2>
                        <div class="feed-item kill">
                            <div class="feed-player">
                                <div class="feed-avatar" style="color: var(--cyan-neon);">Z9</div>
                                <div>
                                    <div class="player-name">Zetros_99</div>
                                    <div class="weapon-tag">Pompe Spas-12</div>
                                </div>
                            </div>
                            <div class="match-info">Il y a 3 min</div>
                        </div>
                    </div>
                </div>

                <!-- 4. MORTS -->
                <div class="page-content">
                    <div class="page-inner">
                        <h2 class="page-title">Dernières Morts</h2>
                        <div class="feed-item death">
                            <div class="feed-player">
                                <div class="feed-avatar" style="color: var(--danger-red);">GO</div>
                                <div>
                                    <div class="player-name">Gotaga</div>
                                    <div class="weapon-tag">Sniper Lourd</div>
                                </div>
                            </div>
                            <div class="match-info">Il y a 12 min</div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Script officiel de Twitch -->
    <script src="https://embed.twitch.tv/embed/v1.js"></script>
    <script>
        function enterSite() {
            document.getElementById('landing-page').classList.add('hidden');
            document.getElementById('main-app').classList.add('active');
        }

        function switchSlide(index, btnElement) {
            const track = document.getElementById('sliderTrack');
            track.style.transform = `translateX(-${index * 25}%)`;

            document.querySelectorAll('.nav-link').forEach(b => b.classList.remove('active'));
            btnElement.classList.add('active');

            btnElement.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
        }

        // Intégration officielle et propre du lecteur Twitch
        try {
            new Twitch.Embed("twitch-embed", {
                width: "100%",
                height: "100%",
                channel: "rvxnnnn",
                layout: "video",
                parent: ["codepen.io", "cdpn.io"]
            });
        } catch(e) {
            console.log("Erreur Twitch Embed");
        }

        // --- ACTUALISATION AUTOMATIQUE TOUTES LES 15 MINUTES ---
        setTimeout(function() {
            location.reload();
        }, 900000);
    </script>
<script>
    // Permet de retourner à l'accueil en cliquant sur le logo en haut à gauche
    document.addEventListener('DOMContentLoaded', () => {
        const logo = document.querySelector('header svg, .logo, header img, [class*="logo"]');
        if (logo) {
            logo.style.cursor = 'pointer';
            logo.addEventListener('click', () => {
                const landing = document.getElementById('landing-page');
                if (landing) {
                    landing.style.display = 'flex';
                    landing.style.opacity = '1';
                    landing.style.visibility = 'visible';
                }
            });
        
  </script>
    
</body>
    </html>
