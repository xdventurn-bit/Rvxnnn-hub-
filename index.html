<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RVXNN - Hub & Kill Feed Tracker</title>
    <style>
        :root {
            --bg-color: #000000;
            --panel-bg: #080b11;
            --cyan-neon: #00f5d4;
            --violet-neon: #9146ff;
            --danger-red: #ff1e1e;
            --text-main: #ffffff;
            --text-muted: #8b949e;
            --border-color: #21262d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            overflow-x: hidden;
            height: 100vh;
        }

        /* --- SYSTÈME DE PAGES (TRANSITION) --- */
        .page {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.5s ease, transform 0.5s ease;
            background: radial-gradient(circle at center, #0a0e17 0%, #000000 100%);
            z-index: 10;
        }

        .page.hidden {
            opacity: 0;
            pointer-events: none;
            transform: scale(1.05);
            z-index: 1;
        }

        /* --- PAGE D'ACCUEIL --- */
        .landing-container {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 25px;
            cursor: pointer;
            padding: 40px;
            border-radius: 20px;
            transition: transform 0.3s ease;
        }

        .landing-container:hover {
            transform: scale(1.02);
        }

        .logo-wrapper {
            width: 180px;
            height: 180px;
            filter: drop-shadow(0 0 20px rgba(255, 30, 30, 0.4));
            transition: filter 0.3s ease;
        }

        .landing-container:hover .logo-wrapper {
            filter: drop-shadow(0 0 35px rgba(255, 30, 30, 0.8));
        }

        .enter-btn {
            background: linear-gradient(135deg, var(--danger-red), #8b0000);
            color: white;
            border: none;
            padding: 14px 35px;
            font-size: 16px;
            font-weight: 900;
            letter-spacing: 3px;
            text-transform: uppercase;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255, 30, 30, 0.4);
            transition: all 0.2s ease-in-out;
        }

        .enter-btn:hover {
            box-shadow: 0 0 25px rgba(255, 30, 30, 0.8);
            transform: translateY(-2px);
        }

        .hint-text {
            color: var(--text-muted);
            font-size: 13px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* --- SITE PRINCIPAL / HUB & KILL FEED --- */
        #main-app {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            background-color: var(--bg-color);
            opacity: 0;
            pointer-events: none;
            z-index: 5;
            transition: opacity 0.5s ease;
        }

        #main-app.active {
            opacity: 1;
            pointer-events: auto;
            z-index: 15;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            background-color: var(--panel-bg);
            border-bottom: 2px solid var(--border-color);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .header-logo {
            width: 45px;
            height: 45px;
        }

        .header-title {
            font-size: 20px;
            font-weight: 900;
            letter-spacing: 2px;
            background: linear-gradient(90deg, var(--text-main), var(--danger-red));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .back-home-btn {
            background: transparent;
            color: var(--text-muted);
            border: 1px solid var(--border-color);
            padding: 8px 16px;
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .back-home-btn:hover {
            border-color: var(--danger-red);
            color: var(--text-main);
        }

        /* Corps du tracker de mort */
        .app-content {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .kill-feed-card {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-left: 5px solid var(--danger-red);
            border-radius: 12px;
            width: 100%;
            max-width: 500px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            position: relative;
            overflow: hidden;
        }

        .kill-feed-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px;
        }

        .kill-feed-title {
            font-size: 14px;
            font-weight: 800;
            color: var(--danger-red);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .live-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            color: var(--cyan-neon);
            font-weight: bold;
        }

        .pulsing-dot {
            width: 8px;
            height: 8px;
            background-color: var(--cyan-neon);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--cyan-neon);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.3); opacity: 1; box-shadow: 0 0 12px var(--cyan-neon); }
            100% { transform: scale(0.95); opacity: 0.8; }
        }

        /* Détails du killer */
        .killer-profile {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 20px;
        }

        .killer-avatar {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: linear-gradient(135deg, #1f293d, #0b0f17);
            border: 2px solid var(--danger-red);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            font-weight: 900;
            color: var(--text-main);
            box-shadow: 0 0 15px rgba(255, 30, 30, 0.3);
        }

        .killer-info h2 {
            font-size: 22px;
            font-weight: 900;
            margin-bottom: 4px;
            color: var(--text-main);
        }

        .killer-info p {
            font-size: 13px;
            color: var(--text-muted);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            background-color: rgba(0,0,0,0.3);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .stat-box {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .stat-label {
            font-size: 11px;
            text-transform: uppercase;
            color: var(--text-muted);
            letter-spacing: 1px;
        }

        .stat-value {
            font-size: 18px;
            font-weight: 900;
            color: var(--cyan-neon);
        }

        .stat-value.damage {
            color: var(--danger-red);
        }
    </style>
</head>
<body>

    <!-- PAGE 1 : ACCUEIL AVEC LOGO CLIQUABLE -->
    <div id="landing-page" class="page" onclick="openMainSite()">
        <div class="landing-container">
            <!-- Logo SVG Dojo unique (Kanji 锐 - Le Tranchant) -->
            <div class="logo-wrapper">
                <svg viewBox="0 0 400 400" width="100%" height="100%">
                    <defs>
                        <linearGradient id="badge-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#ff1e1e" />
                            <stop offset="100%" stop-color="#550000" />
                        </linearGradient>
                        <filter id="red-glow" x="-20%" y="-20%" width="140%" height="140%">
                            <feGaussianBlur stdDeviation="5" result="blur" />
                            <feComposite in="SourceGraphic" in2="blur" operator="over" />
                        </filter>
                    </defs>
                    <rect width="100%" height="100%" rx="24" fill="#040507" />
                    <polygon points="200,30 350,90 320,310 200,370 80,310 50,90" fill="#0b0f17" stroke="url(#badge-gradient)" stroke-width="5" />
                    <polygon points="200,45 332,100 305,295 200,348 95,295 68,100" fill="none" stroke="#1f293d" stroke-width="2" />
                    <path d="M 120,100 L 100,120" stroke="#ff1e1e" stroke-width="3" stroke-linecap="round" />
                    <path d="M 280,100 L 300,120" stroke="#ff1e1e" stroke-width="3" stroke-linecap="round" />
                    <g filter="url(#red-glow)" opacity="0.25">
                        <text x="200" y="240" font-family="'Courier New', monospace" font-weight="900" font-size="160" fill="#ff1e1e" text-anchor="middle">锐</text>
                    </g>
                    <text x="200" y="235" font-family="'Arial Black', sans-serif" font-weight="900" font-size="140" fill="#ffffff" text-anchor="middle" filter="drop-shadow(0px 0px 10px rgba(255, 30, 30, 0.6))">锐</text>
                    <circle cx="200" cy="315" r="4" fill="#ff1e1e" />
                    <line x1="160" y1="315" x2="185" y2="315" stroke="#ff1e1e" stroke-width="2" />
                    <line x1="215" y1="315" x2="240" y2="315" stroke="#ff1e1e" stroke-width="2" />
                </svg>
            </div>
            
            <button class="enter-btn">Entrer sur le site</button>
            <p class="hint-text">Clique n'importe où pour démarrer</p>
        </div>
    </div>

    <!-- PAGE 2 : SITE PRINCIPAL (HUB & KILL FEED) -->
    <div id="main-app">
        <header>
            <div class="header-left">
                <!-- Même logo miniature dans l'en-tête -->
                <div class="header-logo">
                    <svg viewBox="0 0 400 400" width="100%" height="100%">
                        <polygon points="200,30 350,90 320,310 200,370 80,310 50,90" fill="#0b0f17" stroke="#ff1e1e" stroke-width="6" />
                        <text x="200" y="235" font-family="'Arial Black', sans-serif" font-weight="900" font-size="140" fill="#ffffff" text-anchor="middle">锐</text>
                    </svg>
                </div>
                <h1 class="header-title">RVXNN // KILL FEED</h1>
            </div>
            <button class="back-home-btn" onclick="returnHome(event)">Retour Accueil</button>
        </header>

        <div class="app-content">
            <!-- Widget Kill Feed -->
            <div class="kill-feed-card">
                <div class="kill-feed-header">
                    <span class="kill-feed-title">Dernière Élimination</span>
                    <div class="live-badge">
                        <div class="pulsing-dot"></div>
                        <span>SYNC STREAM LIVE</span>
                    </div>
                </div>

                <div class="killer-profile">
                    <div class="killer-avatar">Z9</div>
                    <div class="killer-info">
                        <h2>Zetros_99</h2>
                        <p>Plateforme : PC // Mode : Ranked Unreal</p>
                    </div>
                </div>

                <div class="stats-grid">
                    <div class="stat-box">
                        <span class="stat-label">Arme Fatale</span>
                        <span class="stat-value">Pompe Souffle-Dragon</span>
                    </div>
                    <div class="stat-box">
                        <span class="stat-label">Dégâts Infligés</span>
                        <span class="stat-value damage">200 HP (Headshot)</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function openMainSite() {
            document.getElementById('landing-page').classList.add('hidden');
            document.getElementById('main-app').classList.add('active');
        }

        function returnHome(event) {
            event.stopPropagation(); // Empêche de relancer le clic de la landing page si imbriqué
            document.getElementById('landing-page').classList.remove('hidden');
            document.getElementById('main-app').classList.remove('active');
        }
    </script>
</body>
</html>
